name: Crypto collection

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-observatory-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.6.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -q
      - name: Sample for 340 minutes and publish durable chunks hourly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_crypto() {
            git add data/crypto/
            if ! git diff --cached --quiet; then
              git commit -m "Update crypto observations"
            fi
            for retry in 1 2 3; do
              if git pull --rebase && git push; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            return 1
          }

          uv run crypto-collect --interval-minutes 15 --max-minutes 340 &
          collector_pid=$!
          collector_status=0
          while kill -0 "$collector_pid" 2>/dev/null; do
            sleep 3600 &
            timer_pid=$!
            completed_pid=""
            set +e
            wait -n -p completed_pid "$collector_pid" "$timer_pid"
            completed_status=$?
            set -e
            if [[ "$completed_pid" == "$collector_pid" ]]; then
              collector_status=$completed_status
              kill "$timer_pid" 2>/dev/null || true
              wait "$timer_pid" 2>/dev/null || true
              break
            fi
            # Avoid racing git against an atomic chunk/state rotation. Give the
            # hour-boundary sample a short head start, then freeze collection
            # only for the duration of the local commit/rebase/push.
            sleep 30
            kill -STOP "$collector_pid"
            if ! publish_crypto; then
              kill -CONT "$collector_pid" 2>/dev/null || true
              kill -TERM "$collector_pid" 2>/dev/null || true
              wait "$collector_pid" 2>/dev/null || true
              exit 1
            fi
            kill -CONT "$collector_pid"
          done
          publish_crypto
          exit "$collector_status"
