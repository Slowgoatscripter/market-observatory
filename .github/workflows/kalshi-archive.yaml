name: Kalshi archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

concurrency:
  group: kalshi-observatory-data
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.6.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest
      - name: Backfill until caught_up, then update the live tier
        run: uv run kalshi-archive --mode auto --max-minutes 43
      - name: Show per-run row and chunk byte counts (warn above 250 MB)
        run: uv run python -c "import json; print(json.dumps(json.load(open('data/kalshi/archive-state.json', encoding='utf-8')).get('metrics', {}), sort_keys=True))"
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git diff --cached --quiet || git commit -m "Update Kalshi archive"
          git push
