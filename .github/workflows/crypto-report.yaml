name: Crypto weekly report

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 1"

permissions:
  contents: write

concurrency:
  group: crypto-observatory-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.6.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run crypto-report
      - name: Commit report and ledger, rebase, and push with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto/ reports/crypto.md
          git diff --cached --quiet || git commit -m "Update crypto report"
          for retry in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
