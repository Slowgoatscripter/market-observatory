[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "market-observatory"
version = "0.1.0"
description = "A read-only observer for public prediction-market data"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.scripts]
kalshi-archive = "observatory.kalshi.archive:main"
kalshi-report = "observatory.kalshi.checks:main"
crypto-collect = "observatory.crypto.collector:main"
crypto-report = "observatory.crypto.checks:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["observatory"]
